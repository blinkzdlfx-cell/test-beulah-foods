name: Reconstruct production source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: reconstruction

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct production source
        run: node scripts/reconstruct-source.mjs

      - name: Commit reconstructed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes detected."
            exit 0
          fi
          git commit -m "chore: reconstruct application source from production"
          git push origin HEAD:reconstruction
