<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beulah Foods Admin — Reset Password</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/admin-refinement.css" />
  <link rel="stylesheet" href="css/password-toggle.css" />
</head>
<body>
  <div class="admin-shell">
    <main class="admin-main">
      <section class="admin-card login-card">
        <p class="muted">Beulah Foods administration</p>
        <h1>Set new admin password</h1>
        <p class="muted">Choose a new password for the authorized admin account.</p>

        <div id="alert" class="alert" role="status" hidden></div>

        <form id="reset-password-form" class="stack">
          <div class="field">
            <label for="new-password">New password</label>
            <input id="new-password" name="password" type="password" autocomplete="new-password" data-password-toggle minlength="8" required />
          </div>
          <div class="field">
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" data-password-toggle minlength="8" required />
          </div>
          <button id="submit-button" class="btn btn-primary" type="submit">Update password</button>
        </form>

        <p class="muted" style="margin-top:20px">
          <a href="/admin/">Back to admin sign in</a>
        </p>
      </section>
    </main>
  </div>

  <script type="module">
    import { supabase } from "./js/lib/supabaseClient.js";

    const form = document.getElementById("reset-password-form");
    const passwordInput = document.getElementById("new-password");
    const confirmInput = document.getElementById("confirm-password");
    const submitButton = document.getElementById("submit-button");
    const alertBox = document.getElementById("alert");

    function showAlert(message, type = "success") {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
      alertBox.hidden = false;
    }

    async function verifyRecoverySession() {
      const { data, error } = await supabase.auth.getSession();
      if (error) throw error;

      if (!data.session) {
        form.hidden = true;
        showAlert("This password reset link is invalid or has expired. Request a new link from the admin password recovery page.", "error");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      alertBox.hidden = true;

      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (password !== confirmPassword) {
        showAlert("The passwords do not match.", "error");
        return;
      }

      submitButton.disabled = true;

      try {
        const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
        if (sessionError) throw sessionError;
        if (!sessionData.session) throw new Error("Your password reset session is missing or has expired.");

        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;

        showAlert("Password updated successfully. You can now sign in with your new password.");
        form.reset();
      } catch (error) {
        showAlert(error?.message || "Unable to update the password.", "error");
      } finally {
        submitButton.disabled = false;
      }
    });

    try {
      await verifyRecoverySession();
    } catch (error) {
      form.hidden = true;
      showAlert(error?.message || "Unable to verify the password reset session.", "error");
    }
  </script>
  <script type="module" src="js/passwordToggle.js"></script>
</body>
</html>
