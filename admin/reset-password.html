<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beulah Foods Admin — Reset Password</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/admin-refinement.css" />
  <link rel="stylesheet" href="css/password-toggle.css" />
</head>
<body>
  <div class="admin-shell">
    <main class="admin-main">
      <section class="admin-card login-card">
        <p class="muted">Beulah Foods administration</p>
        <h1>Set new admin password</h1>
        <p class="muted">Choose a new password for the authorized admin account.</p>

        <div id="alert" class="alert" role="status" hidden></div>
        <p id="reset-status" class="muted">Verifying your password reset link…</p>

        <form id="reset-password-form" class="stack" hidden>
          <div class="field">
            <label for="new-password">New password</label>
            <input id="new-password" name="password" type="password" autocomplete="new-password" data-password-toggle minlength="8" required />
          </div>
          <div class="field">
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" data-password-toggle minlength="8" required />
          </div>
          <button id="submit-button" class="btn btn-primary" type="submit">Update password</button>
        </form>

        <p class="muted" style="margin-top:20px">
          <a href="/admin/forgot-password.html">Request another reset link</a>
          <span aria-hidden="true"> · </span>
          <a href="/admin/">Back to admin sign in</a>
        </p>
      </section>
    </main>
  </div>

  <script type="module">
    import { supabase } from "./js/lib/supabaseClient.js";

    const form = document.getElementById("reset-password-form");
    const passwordInput = document.getElementById("new-password");
    const confirmInput = document.getElementById("confirm-password");
    const submitButton = document.getElementById("submit-button");
    const alertBox = document.getElementById("alert");
    const resetStatus = document.getElementById("reset-status");

    let recoveryReady = false;
    let completed = false;

    function showAlert(message, type = "success") {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
      alertBox.hidden = false;
    }

    function showResetForm() {
      recoveryReady = true;
      resetStatus.hidden = true;
      form.hidden = false;
    }

    function showLinkError(message = "This password reset link is invalid or has expired. Request a new link.") {
      if (completed) return;
      resetStatus.hidden = true;
      form.hidden = true;
      showAlert(message, "error");
    }

    const { data: authListener } = supabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        showResetForm();
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      alertBox.hidden = true;

      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (password !== confirmPassword) {
        showAlert("The passwords do not match.", "error");
        return;
      }

      if (!recoveryReady) {
        showLinkError("Your password reset session is not ready. Request a new reset link and open it again.");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Updating…";

      try {
        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;

        completed = true;
        form.hidden = true;
        showAlert("Password updated successfully. You can now sign in with your new password.");
      } catch (error) {
        showAlert(error?.message || "Unable to update the password.", "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Update password";
      }
    });

    const urlError = new URLSearchParams(window.location.hash.replace(/^#/, "")).get("error_description")
      || new URLSearchParams(window.location.search).get("error_description");

    if (urlError) {
      showLinkError(urlError.replace(/\+/g, " "));
    } else {
      setTimeout(() => {
        if (!recoveryReady) {
          showLinkError();
        }
      }, 10000);
    }

    window.addEventListener("beforeunload", () => authListener?.subscription?.unsubscribe?.());
  </script>
  <script type="module" src="js/passwordToggle.js"></script>
</body>
</html>
