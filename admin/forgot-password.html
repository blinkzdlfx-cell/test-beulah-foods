<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beulah Foods Admin — Forgot Password</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/admin-refinement.css" />
</head>
<body>
  <div class="admin-shell">
    <main class="admin-main">
      <section class="admin-card login-card">
        <p class="muted">Beulah Foods administration</p>
        <h1>Reset admin password</h1>
        <p class="muted">Enter the email address of an account already provisioned for the admin area.</p>

        <div id="alert" class="alert" role="status" hidden></div>

        <form id="forgot-password-form" class="stack">
          <div class="field">
            <label for="admin-email">Admin email</label>
            <input id="admin-email" name="email" type="email" autocomplete="username" required />
          </div>
          <button id="submit-button" class="btn btn-primary" type="submit">Send reset link</button>
        </form>

        <p class="muted" style="margin-top:20px">
          <a href="/admin/">Back to admin sign in</a>
        </p>
      </section>
    </main>
  </div>

  <script type="module">
    import { supabase } from "./js/lib/supabaseClient.js";

    const form = document.getElementById("forgot-password-form");
    const emailInput = document.getElementById("admin-email");
    const submitButton = document.getElementById("submit-button");
    const alertBox = document.getElementById("alert");

    function showAlert(message, type = "success") {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
      alertBox.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      alertBox.hidden = true;
      submitButton.disabled = true;

      try {
        const email = emailInput.value.trim();
        const redirectTo = new URL("reset-password.html", `${window.location.origin}/admin/`).href;

        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo,
        });

        if (error) throw error;

        showAlert("If this email belongs to an authorized admin account, a password reset link has been sent.");
        form.reset();
      } catch (error) {
        showAlert(error?.message || "Unable to send the password reset email.", "error");
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
